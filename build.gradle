plugins {
    id 'base'
    id 'dev.architectury.loom' version '1.17.493' apply false
}
allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}
project(':forge') { ext['loom.platform'] = 'forge' }
tasks.register('collectJars', Sync) {
    dependsOn ':fabric:remapJar', ':forge:remapJar'
    from(project(':fabric').tasks.named('remapJar').flatMap { it.archiveFile })
    from(project(':forge').tasks.named('remapJar').flatMap { it.archiveFile })
    into(layout.buildDirectory.dir('libs'))
}
tasks.named('build') {
    dependsOn ':fabric:build', ':forge:build', 'collectJars', ':common:validateSharedResources'
}
tasks.named('clean') { dependsOn ':fabric:clean', ':forge:clean', ':common:clean' }

// Packaging is part of the build, so a successful compile cannot hide missing data.
tasks.register('verifyLoaderJars') {
    dependsOn ':fabric:remapJar', ':forge:remapJar', ':common:validateSharedResources'
    doLast {
        ['fabric', 'forge'].each { loader ->
            def artifact = project(":" + loader).tasks.named('remapJar').get().archiveFile.get().asFile
            new java.util.jar.JarFile(artifact).withCloseable { jar ->
                def names = jar.entries().collect { it.name }
                def ownMetadata = loader == 'fabric' ? 'fabric.mod.json' : 'META-INF/mods.toml'
                def otherMetadata = loader == 'fabric' ? 'META-INF/mods.toml' : 'fabric.mod.json'
                if (!names.contains(ownMetadata) || names.contains(otherMetadata)) {
                    throw new GradleException('Loader metadata is incorrect in ' + artifact.name)
                }
                if (loader == 'forge' && !names.contains('pack.mcmeta')) {
                    throw new GradleException('Missing Forge resource pack metadata in ' + artifact.name)
                }
                def metadata = jar.getInputStream(jar.getJarEntry(ownMetadata)).getText('UTF-8')
                if (metadata.contains('$' + '{version}')) throw new GradleException('Unexpanded version in ' + artifact.name)
                ['assets', 'data'].each { prefix ->
                    fileTree('common/src/main/resources/' + prefix).files.each { original ->
                        def relative = file('common/src/main/resources').toPath().relativize(original.toPath()).toString().replace('\\', '/')
                        def entry = jar.getJarEntry(relative)
                        if (entry == null || !java.util.Arrays.equals(original.bytes, jar.getInputStream(entry).bytes)) {
                            throw new GradleException('Missing or changed shared resource in ' + artifact.name + ': ' + relative)
                        }
                    }
                }
                names.findAll { it.endsWith('.mixins.json') }.each { name ->
                    def config = new groovy.json.JsonSlurper().parse(jar.getInputStream(jar.getJarEntry(name)))
                    if (!names.contains(config.refmap)) throw new GradleException('Missing mixin refmap: ' + name)
                    def refmapText = jar.getInputStream(jar.getJarEntry(config.refmap)).getText('UTF-8')
                    if (refmapText.contains('L/;')) throw new GradleException('Invalid generic type descriptor in mixin refmap: ' + name)

                    def packagePath = config.package.replace('.', '/') + '/'
                    ((config.mixins ?: []) + (config.client ?: []) + (config.server ?: [])).each { mixin ->
                        if (!names.contains(packagePath + mixin.replace('.', '/') + '.class')) {
                            throw new GradleException('Missing mixin class: ' + mixin)
                        }
                    }
                }
                logger.lifecycle('Verified ' + loader + ' metadata, mixins and shared resources: ' + artifact.name)
            }
        }
    }
}
tasks.named('collectJars') { dependsOn 'verifyLoaderJars' }
