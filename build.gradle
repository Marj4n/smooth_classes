plugins {
    id 'fabric-loom' version '1.17.21'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "smooth_classes" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}


repositories {
    maven { url "https://www.cursemaven.com"; content { includeGroup "curse.maven" } }
    maven { name = "Modrinth"; url = "https://api.modrinth.com/maven"; content { includeGroup "maven.modrinth" } }
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "curse.maven:puffish-skills-835091:${project.puffish_skills_version}"
    modImplementation "curse.maven:puffish-attributes-991341:${project.puffish_attributes_version}"
    modImplementation "maven.modrinth:spell-power:${project.spellpower_version}-fabric"
    modImplementation "maven.modrinth:spell-engine:${project.spell_engine_version}-fabric"
    // Homunculus body-patch + integrated weapon slots. Accessories is a runtime dependency;
    // its JAR is downloaded by Gradle and never redistributed in our source archive.
    modImplementation "maven.modrinth:jtmvUHXj:BmhkZr5J" // Accessories Fabric 1.0.0-beta.47+1.20.1
    // Only used at compile time by the conditional compatibility mixin. NEVER bundled.
    modCompileOnly "maven.modrinth:AKbBSvuC:JwA6Nkik" // Bewitchment 1.20-10
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}


// Do not ship an apparently successful JAR with its Puffish Skills datapack missing.
// These configs define the Class/Ascendancy/Vampire trees; saved unlocks are
// meaningless to the UI until their original category and skill IDs are loaded.
tasks.register('validateSkillTreeResources') {
    group = 'verification'
    description = 'Fails before compilation/resource packaging if core Puffish Skills data is missing.'
    doLast {
        def skillsDir = file('src/main/resources/data/smooth_classes/puffish_skills')
        def configFile = new File(skillsDir, 'config.json')
        if (!configFile.isFile()) {
            throw new GradleException('Smooth Classes Puffish Skills config.json is missing. Restore src/main/resources/data/ from the full source ZIP before building.')
        }
        def config = new groovy.json.JsonSlurper().parse(configFile)
        def requiredCategories = [
            'tree', 'avenger', 'foreigner', 'caster', 'berserker',
            'archer', 'assassin', 'saber', 'ruler', 'rider', 'lancer',
            'ascendancy', 'origin_vampire'
        ]
        if (!(config.categories instanceof Collection) || !config.categories.containsAll(requiredCategories)) {
            throw new GradleException('Smooth Classes Skill Tree config is missing core Class/Ascendancy/Vampire categories. Restore the original config.json.')
        }
        if (config.categories.contains('origin_human')) {
            throw new GradleException('Human is vanilla and must not have an Origin skill category.')
        }
        requiredCategories.each { category ->
            def categoryDir = new File(skillsDir, 'categories/' + category)
            ['category.json', 'skills.json', 'definitions.json'].each { name ->
                if (!new File(categoryDir, name).isFile()) {
                    throw new GradleException('Missing Puffish Skills resource: ' + category + '/' + name)
                }
            }
        }
    }
}
tasks.named('processResources') {
    dependsOn tasks.named('validateSkillTreeResources')
}
