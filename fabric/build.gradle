plugins { id 'dev.architectury.loom'; id 'maven-publish' }
base { archivesName = rootProject.archives_base_name }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
repositories {
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.su5ed.dev/releases' }
    maven { url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    mavenCentral()
}
repositories.exclusiveContent {
    forRepository { repositories.maven { name = 'ModrinthExclusive'; url = 'https://api.modrinth.com/maven' } }
    filter { includeGroup 'maven.modrinth' }
}
repositories.exclusiveContent {
    forRepository { repositories.maven { name = 'CurseMavenExclusive'; url = 'https://www.cursemaven.com' } }
    filter { includeGroup 'curse.maven' }
}
repositories.exclusiveContent {
    forRepository { repositories.maven { name = 'SinytraExclusive'; url = 'https://maven.su5ed.dev/releases' } }
    filter { includeGroupByRegex 'dev[.]su5ed[.]sinytra.*' }
}
sourceSets.main.java.srcDirs += [rootProject.file('common/src/main/java'), rootProject.file('common/src/client/java')]
sourceSets.main.resources.srcDirs += [rootProject.file('common/src/main/resources'), rootProject.file('common/src/client/resources')]
dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
    modImplementation 'maven.modrinth:hqQqvaa4:g3pzFlwX'
    modImplementation "curse.maven:puffish-attributes-991341:7551332"
    modImplementation 'maven.modrinth:spell-engine:mvZvOSVL'
    modImplementation 'maven.modrinth:spell-power:7FbHvvWA'
    modImplementation 'maven.modrinth:accessories:mee7rWXz'
    modCompileOnly 'maven.modrinth:AKbBSvuC:JwA6Nkik'
}
loom {
    mixin { useLegacyMixinAp = true; defaultRefmapName = "smooth_classes.refmap.json" }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17; options.compilerArgs += ['-Xlint:deprecation','-Xlint:unchecked','-Xmaxwarns','1000'] }
def expandedModMetadata = [version: project.version, minecraft_version: rootProject.minecraft_version, loader_version: rootProject.loader_version]
tasks.named('processResources') {
    dependsOn ':common:validateSharedResources'
    inputs.property 'version', project.version
    filesMatching(['fabric.mod.json', 'META-INF/mods.toml']) {
        expand expandedModMetadata
    }
}
tasks.named('jar') {
    archiveClassifier = 'dev-fabric'
    from(rootProject.file('LICENSE.txt'))
}
tasks.named('remapJar') { archiveClassifier = 'fabric' }
tasks.named('sourcesJar') { archiveClassifier = 'fabric-sources' }

sourceSets.test.java.srcDirs += [rootProject.file('common/src/test/java')]
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation "net.fabricmc:fabric-loader-junit:${rootProject.loader_version}"
    modLocalRuntime('me.shedaniel.cloth:cloth-config-fabric:11.1.136') { transitive = false }
    modLocalRuntime('maven.modrinth:playeranimator:yDqYTUaf') { transitive = false }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
tasks.named('test') { useJUnitPlatform() }

// Loom's development classpath does not expose Spell Power's nested config mod
// to the JUnit launcher. Make that existing runtime library available to tests.
configurations { testEmbeddedMods }
dependencies {
    testEmbeddedMods('maven.modrinth:spell-power:7FbHvvWA') { transitive = false }
}
def testEmbeddedDir = layout.buildDirectory.dir('test-embedded-mods')
def extractTestEmbeddedMods = tasks.register('extractTestEmbeddedMods', Sync) {
    from { zipTree(configurations.testEmbeddedMods.singleFile).matching { include 'META-INF/jars/tiny-config-*.jar' } }
    into testEmbeddedDir
}
tasks.named('test') {
    dependsOn extractTestEmbeddedMods
    classpath += files(provider { fileTree(testEmbeddedDir.get().asFile).matching { include '**/*.jar' }.files })
}
